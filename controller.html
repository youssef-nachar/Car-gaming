<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b121b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Street Racing • Controller</title>
<link rel="stylesheet" href="./controller.css">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
  
<section id="join-screen" class="join-screen">
  <div class="logo">🏎️ STREET RACING <small>41000 • MOBILE CONTROLLER</small></div>
  <h1>Join the<br><em>city drive.</em></h1>
  <p>Enter the room code shown on the big screen, then turn your phone sideways.</p>
  <input id="name-input" placeholder="YOUR NAME (optional)" maxlength="14" autocomplete="off">
  <input id="room-input" placeholder="RACE-1234" maxlength="20" autocomplete="off" autocapitalize="characters">
  <button id="join-btn">CONNECT TO GAME</button>
  <div id="status-msg">Waiting to connect…</div>
</section>
<main id="gamepad" class="gamepad" hidden>
  <header>
    <div id="my-color">DRIVER</div>
    <div class="speed"><b id="spd">0</b><span>KM/H</span></div>
    <div id="lives" class="lives">♥♥♥♥♥♥</div>
    <div class="nitro" title="Nitro"><i id="nitro-fill"></i></div>
    <button class="mini" id="btn-mode">STEER: WHEEL</button>
    <button class="mini" id="btn-sens">STEERING: NORMAL</button>
    <button class="mini" id="btn-swap">⇄</button>
    <button class="mini" id="btn-view">📷 VIEW</button>
    <button class="mini" id="btn-pause">Ⅱ</button>
  </header>
  <section class="controls">
    <div class="wheel-zone">
      <div id="wheel" class="wheel">
        <div id="wheel-rot" class="wheel-rot">
          <svg viewBox="0 0 200 200" aria-label="Steering wheel">
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7d95a6"/><stop offset="1" stop-color="#1d2c39"/></linearGradient></defs>
            <circle cx="100" cy="100" r="86" fill="none" stroke="#0007" stroke-width="22"/>
            <circle cx="100" cy="100" r="86" fill="none" stroke="url(#g)" stroke-width="17"/>
            <path d="M100 100 L16 106 M100 100 L184 106 M100 100 L100 180" stroke="url(#g)" stroke-width="13" stroke-linecap="round"/>
            <circle cx="100" cy="100" r="24" fill="#101b26" stroke="#8ea5b6" stroke-width="3"/>
            <text x="100" y="108" text-anchor="middle" font-size="22">🏎️</text>
            <rect x="93" y="6" width="14" height="22" rx="4" fill="#a7f36d"/>
          </svg>
        </div>
      </div>
    </div>
    <div id="cam-win" class="cam-win" hidden>
      <canvas id="cam-img" width="320" height="180"></canvas>
      <div class="cam-tag">● FIRST PERSON</div>
      <button id="cam-x" class="cam-x" aria-label="Close view">✕</button>
    </div>
    <div id="arrow-zone" class="arrow-zone">
      <button id="btn-left" class="arrow" aria-label="Left">◀</button>
      <button id="btn-right" class="arrow" aria-label="Right">▶</button>
    </div>
    <button id="btn-fire" class="fire" aria-label="Fire"><span id="fire-ico">•</span><b>FIRE</b></button>
    <div class="pedals">
      <button id="btn-boost" class="boost"><span>⚡</span><b>NITRO</b></button>
      <button id="btn-brake" class="brake"><span>▼</span><b>BRAKE</b></button>
      <button id="btn-accel" class="accel"><span>▲</span><b>GAS</b></button>
    </div>
  </section>
</main>
<div id="lost" class="lost" hidden><div>● RECONNECTING…<small>Keep this page open</small></div></div>
<div class="rotate"><div>📱↻<br>ROTATE YOUR PHONE<small>Landscape mode gives you the full controller</small></div></div>
<script src="./controller.js"></script>
</body>
</html>
